title: Mise
description: Terms of Use, Privacy Policy and support for the Mise app.
# No theme: _layouts/default.html is self-contained, so the pages load nothing
# from other websites (the Privacy Policy says they use no analytics).
defaults:
  - scope: { path: "terms.md" }
    values: { title: "Terms of Use" }
  - scope: { path: "privacy.md" }
    values: { title: "Privacy Policy" }
  - scope: { path: "support.md" }
    values: { title: "Support and account deletion" }
  - scope: { path: "README.md" }
    values: { title: "Legal and support" }
