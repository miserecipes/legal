<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}Mise</title>
<meta name="description" content="{{ site.description }}">
<style>
  /* Everything is inline: these pages load nothing from other websites. */
  :root { color-scheme: light; }
  body { margin: 0; background: #FAF3E7; color: #171310; font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header, main, footer { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  header { padding-top: 24px; font: 600 20px Georgia, serif; }
  header a { color: inherit; text-decoration: none; }
  nav { margin-top: 6px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  nav a { margin-right: 16px; }
  main { padding-bottom: 48px; }
  h1, h2, h3 { font-family: Georgia, serif; line-height: 1.25; }
  h1 { font-size: 32px; margin-top: 28px; }
  h2 { font-size: 22px; margin-top: 32px; }
  a { color: #B5421F; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #D9C9B0; padding: 6px 8px; text-align: left; vertical-align: top; }
  code { background: #F1E6D3; padding: 1px 4px; border-radius: 4px; }
  footer { padding-bottom: 32px; color: #6B6259; font-size: 14px; }
</style>
</head>
<body>
<header><a href="{{ '/' | relative_url }}">Mise</a>
  <nav><a href="{{ '/terms' | relative_url }}">Terms of Use</a><a href="{{ '/privacy' | relative_url }}">Privacy Policy</a><a href="{{ '/support' | relative_url }}">Support</a></nav>
</header>
<main>
{{ content }}
</main>
</body>
</html>
